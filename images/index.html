<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operation Sly Fox</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080a09;
    color: #b7ff5a;
    font-family: monospace;
    text-align: center;
}

.screen {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.screen .container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
}

.hidden {
    display: none !important;
}

.top-secret {
    color: #ff3b30;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

h1 {
    font-size: 32px;
    letter-spacing: 5px;
    margin-bottom: 10px;
}

h2 {
    line-height: 1.5;
}

.case {
    color: #777;
    margin-bottom: 40px;
}

.button {
    background: transparent;
    color: #b7ff5a;
    border: 1px solid #b7ff5a;
    padding: 15px 30px;
    font-family: monospace;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s ease;
}

.button:hover {
    background: #b7ff5a;
    color: #080a09;
}

.button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ============================= */
/* ACCESS / LOGIN                 */
/* ============================= */

.access-box {
    margin-top: 30px;
}

.access-box label {
    display: block;
    width: 100%;
    margin-bottom: 12px;

    font-size: 17px;
    line-height: 1.4;
    letter-spacing: 1.5px;
}

.access-box input {
    display: block;
    width: 100%;
    min-height: 54px;

    margin: 0 auto;

    padding: 14px 16px;

    font-size: 18px;
    text-align: center;

    background: transparent;
    color: #b7ff5a;

    border: 1px solid #555;
    border-radius: 10px;

    outline: none;
    font-family: monospace;
}

.access-box input:focus {
    border-color: #b7ff5a;
}

.access-box .button {
    display: block;
    width: 100%;

    margin-top: 28px;
    margin-bottom: 35px;

    min-height: 56px;

    font-size: 17px;
    font-weight: bold;
}

#accessMessage,
#codenameMessage {
    margin-top: 18px;
    font-size: 16px;
    line-height: 1.5;
}

/* ============================= */
/* HQ                              */
/* ============================= */

.mission-status {
    width: 100%;
    margin: 25px auto;
    padding: 14px 18px;

    border: 1px solid rgba(183, 255, 90, 0.35);
    border-radius: 12px;

    background: rgba(183, 255, 90, 0.04);
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 9px 0;

    font-size: 14px;
    letter-spacing: 1px;
}

.status-row + .status-row {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.status-row span {
    color: #999;
}

.status-row strong {
    color: #b7ff5a;
}

.hq-welcome {
    font-size: 20px;
    font-weight: bold;
    margin-top: 25px;
}

.hq-message {
    color: #ccc;
}

.tease {
    margin-top: 20px;
    color: #b7ff5a;
    font-style: italic;
    line-height: 1.6;
}

/* ============================= */
/* CASE GRID                      */
/* ============================= */

.case-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 25px;
    width: 100%;
}

.case-card {
    width: 100%;
    min-height: 125px;

    padding: 20px;

    background: rgba(10, 10, 10, 0.85);
    border: 1px solid #b7ff5a;
    border-radius: 14px;

    color: white;
    text-align: left;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    font-family: monospace;
}

.case-card:hover {
    background: rgba(183, 255, 90, 0.08);
    box-shadow: 0 0 18px rgba(183, 255, 90, 0.15);
}

.case-card:active {
    transform: scale(0.97);
}

.case-number {
    font-size: 12px;
    color: #b7ff5a;
    letter-spacing: 2px;
}

.case-title {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.3;
}

.case-status {
    font-size: 11px;
    color: #999;
    letter-spacing: 1px;
}

/* ============================= */
/* QUIZ                           */
/* ============================= */

.quiz-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
}

.quiz-option {
    background: transparent;
    color: #b7ff5a;

    border: 1px solid #555;

    padding: 14px;

    font-family: monospace;
    font-size: 14px;

    cursor: pointer;
    text-align: left;

    border-radius: 6px;
}

.quiz-option:hover {
    border-color: #b7ff5a;
    background: rgba(183, 255, 90, 0.08);
}

.quiz-option:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* ============================= */
/* INPUTS / TEXTAREAS             */
/* ============================= */

.quiz-input {
    width: 85%;
    max-width: 300px;
    box-sizing: border-box;

    background: transparent;
    color: #b7ff5a;

    border: 1px solid #555;
    padding: 12px;

    font-family: monospace;
    font-size: 14px;

    outline: none;
    text-align: center;
}

.quiz-input:focus {
    border-color: #b7ff5a;
}

.quiz-input::placeholder {
    color: #666;
}

.case-textarea,
.assignment-textarea {
    display: block;

    width: 100%;
    min-height: 220px;

    margin-top: 20px;
    padding: 16px;

    background: #080a09;
    color: #b7ff5a;

    border: 1px solid #555;
    border-radius: 10px;

    font-family: monospace;
    font-size: 16px;
    line-height: 1.6;

    resize: vertical;
    outline: none;
}

.case-textarea:focus,
.assignment-textarea:focus {
    border-color: #b7ff5a;
    box-shadow: 0 0 12px rgba(183, 255, 90, 0.12);
}

.case-textarea::placeholder,
.assignment-textarea::placeholder {
    color: #666;
}

/* ============================= */
/* ASSIGNMENTS                    */
/* ============================= */

.assignment-question {
    width: 100%;
    margin: 35px 0;
    text-align: left;
}

.assignment-question h2 {
    color: #b7ff5a;
    font-size: 17px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    margin-bottom: 15px;
}

/* ============================= */
/* EVIDENCE PHOTOS                */
/* ============================= */

.bite-photo {
    width: 82%;
    max-width: 300px;
    height: 210px;

    object-fit: cover;
    object-position: center;

    display: block;
    margin: 18px auto;

    background: white;
    padding: 8px;

    border: none;

    box-shadow: 0 5px 18px rgba(0,0,0,0.5);

    transform: rotate(-2deg);
}

.bite-photo.second {
    transform: rotate(2deg);
}

img,
input,
textarea,
button {
    max-width: 100%;
}

/* ============================= */
/* MOBILE                        */
/* ============================= */

@media (max-width: 600px) {

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 19px;
    }

    .container {
        padding-bottom: 20px;
    }

    .button {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- ===================================================== -->
<!-- ACCESS SCREEN                                         -->
<!-- ===================================================== -->

<div id="accessScreen" class="screen">

    <div class="container">

        <div class="top-secret">
            TOP SECRET
        </div>

        <h1>OPERATION SPY</h1>

        <div class="case">
            CLASSIFIED ACCESS
        </div>

        <p>
            STRAVA INTELLIGENCE NETWORK
        </p>

        <p>
            IDENTITY VERIFICATION REQUIRED
        </p>

        <div class="access-box">

            <label for="accessCode">
                ENTER ACCESS CODE
            </label>

            <input
                type="password"
                id="accessCode"
                placeholder="••••••••"
                autocomplete="off"
            >

            <button
                class="button"
                onclick="verifyAccess()">
                AUTHENTICATE
            </button>

            <p id="accessMessage"></p>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- CODENAME SCREEN                                       -->
<!-- ===================================================== -->

<div id="codenameScreen" class="screen" style="display:none;">

    <div class="container">

        <div class="top-secret">
            IDENTITY VERIFIED
        </div>

        <h1>WELCOME, AGENT</h1>

        <p>
            Before entering the Operation Spy network,
            confirm your codename.
        </p>

        <div class="access-box">

            <label for="codename">
                ENTER CODENAME
            </label>

            <input
                type="text"
                id="codename"
                placeholder="Your codename..."
                autocomplete="off"
            >

            <button
                class="button"
                onclick="verifyCodename()">
                CONFIRM IDENTITY
            </button>

            <p id="codenameMessage"></p>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- HQ SCREEN                                             -->
<!-- ===================================================== -->

<div id="hqScreen" class="screen" style="display:none;">

    <div class="container" id="hqContainer">

    </div>

</div>


<script>

/* ===================================================== */
/* CONFIGURATION                                         */
/* ===================================================== */

const ACCESS_CODE = "BunnyFox";

const FORMSPREE_ENDPOINT =
    "https://formspree.io/f/moeandra";


/* ===================================================== */
/* CASE PROGRESS                                         */
/* ===================================================== */

let caseProgress = {

    case001:
        localStorage.getItem("case001Complete") === "true",

    case002:
        localStorage.getItem("case002Complete") === "true",

    case003:
        localStorage.getItem("case003Complete") === "true"

};


/* ===================================================== */
/* CASE 001 STATE                                        */
/* ===================================================== */

let case001Sequence = [];

let case001NextStep = 1;


/* ===================================================== */
/* CASE 003 STATE                                        */
/* ===================================================== */

let case003Answers = {

    stage1: "",
    stage2: "",
    stage3: "",
    stage4: ""

};


/* ===================================================== */
/* GENERAL HELPERS                                       */
/* ===================================================== */

function getActiveContainer() {

    const hqContainer =
        document.getElementById("hqContainer");

    return hqContainer;

}


function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.style.display = "none";

        });

    document
        .getElementById(screenId)
        .style.display = "flex";

}


/* ===================================================== */
/* ACCESS                                               */
/* ===================================================== */

function verifyAccess() {

    const enteredCode =
        document
            .getElementById("accessCode")
            .value
            .trim();

    const message =
        document.getElementById("accessMessage");


    if (enteredCode === ACCESS_CODE) {

        message.style.color = "#b7ff5a";

        message.textContent =
            "ACCESS GRANTED. Welcome, Agent Fox. 🦊";


        setTimeout(() => {

            showScreen("codenameScreen");

        }, 900);


    } else {

        message.style.color = "#ff3b30";

        message.textContent =
            "ACCESS DENIED. Nice try, Fox. 😋";

    }

}


/* ===================================================== */
/* CODENAME                                             */
/* ===================================================== */

function verifyCodename() {

    const enteredName =
        document
            .getElementById("codename")
            .value
            .trim()
            .toUpperCase();

    const message =
        document.getElementById("codenameMessage");


    if (enteredName === "SLY FOX") {

        message.style.color = "#b7ff5a";

        message.textContent =
            "CODENAME CONFIRMED. Welcome, Sly Fox. 🦊";


        setTimeout(() => {

            showScreen("hqScreen");

            showHQ();

        }, 1200);


    } else {

        message.style.color = "#ff3b30";

        message.textContent =
            "IDENTITY REJECTED. Nice try, stranger. 🐰";

    }

}


/* ===================================================== */
/* HQ                                                   */
/* ===================================================== */

function showHQ() {

    const completedCount =

        Number(caseProgress.case001) +
        Number(caseProgress.case002) +
        Number(caseProgress.case003);


    let tease;


    if (caseProgress.case003) {

        tease =
            "All three cases solved.";

    } else if (caseProgress.case002) {

        tease =
            "Two cases solved. The final investigation awaits.";

    } else if (caseProgress.case001) {

        tease =
            "One case solved. Another investigation awaits.";

    } else {

        tease =
            "Your first investigation awaits.";

    }


    document.getElementById("hqContainer").innerHTML = `

        <div class="top-secret">
            BUNNY EYES ONLY
        </div>

        <h1>OPERATION SPY</h1>

        <div class="case">
            AGENT: SLY FOX 🦊
        </div>


        <div class="mission-status">

            <div class="status-row">

                <span>STATUS</span>

                <strong>
                    ACTIVE
                </strong>

            </div>


            <div class="status-row">

                <span>CASE FILES</span>

                <strong>
                    ${completedCount} / 3
                </strong>

            </div>

        </div>


        <p class="hq-welcome">
            WELCOME BACK, AGENT FOX.
        </p>


        <p class="hq-message">
            Your classified case files are waiting.
        </p>


        <p class="tease">

            ${tease}

            <br>

            The Bunny is watching. 😋

        </p>


        <br>


        <h2>
            CLASSIFIED CASE FILES
        </h2>


        <div class="case-grid">


            <!-- CASE 001 -->

            <button
                class="case-card"
                onclick="openCase(1)">

                <span class="case-number">
                    CASE 001
                </span>

                <span class="case-title">
                    🩹 THE BANDAGE INCIDENT
                </span>

                <span class="case-status">

                    ${
                        caseProgress.case001
                            ? "✓ CASE COMPLETED"
                            : "FILE AVAILABLE"
                    }

                </span>

            </button>


            <!-- CASE 002 -->

            <button
                class="case-card"
                onclick="openCase(2)">

                <span class="case-number">
                    CASE 002
                </span>

                <span class="case-title">
                    🦷 THE BITE INCIDENTS
                </span>

                <span class="case-status">

                    ${
                        caseProgress.case002

                            ? "✓ CASE COMPLETED"

                            : caseProgress.case001

                                ? "FILE AVAILABLE"

                                : "🔒 LOCKED — COMPLETE CASE 001"
                    }

                </span>

            </button>


            <!-- CASE 003 -->

            <button
                class="case-card"
                onclick="openCase(3)">

                <span class="case-number">
                    CASE 003
                </span>

                <span class="case-title">
                    🦊 THE DECISION
                </span>

                <span class="case-status">

                    ${
                        caseProgress.case003

                            ? "✓ CASE COMPLETED"

                            : caseProgress.case002

                                ? "FILE AVAILABLE"

                                : "🔒 LOCKED — COMPLETE CASE 002"
                    }

                </span>

            </button>


        </div>

    `;
}


/* ===================================================== */
/* OPEN CASE                                             */
/* ===================================================== */

function openCase(caseNumber) {

    if (caseNumber === 1) {

        if (caseProgress.case001) {

            showCase001Completed();

        } else {

            showCase001MemoryCheck();

        }

        return;
    }


    if (caseNumber === 2) {

        if (caseProgress.case001) {

            if (caseProgress.case002) {

                showCase002Completed();

            } else {

                nextCase();

            }

        } else {

            showLockedCase(2);

        }

        return;
    }


    if (caseNumber === 3) {

        if (caseProgress.case003) {

            showCase003Completed();

        } else if (caseProgress.case002) {

            startCase003();

        } else {

            showLockedCase(3);

        }

    }

}


/* ===================================================== */
/* LOCKED CASE                                          */
/* ===================================================== */

function showLockedCase(caseNumber) {

    const titles = {

        2: "THE BITE INCIDENTS",

        3: "THE DECISION"

    };


    getActiveContainer().innerHTML = `

        <div class="top-secret">
            ACCESS DENIED
        </div>

        <h1>🔒</h1>

        <div class="case">
            CASE ${String(caseNumber).padStart(3, "0")}
        </div>

        <h2>
            ${titles[caseNumber]}
        </h2>

        <p style="color:#ff3b30;">
            CLASSIFIED FILE LOCKED.
        </p>

        <br>

        <p>
            Nice try, Fox. 😋
        </p>

        <p>
            You don't get to skip your homework.
        </p>

        <p style="color:#b7ff5a;">
            Complete the previous investigation first.
        </p>

        <br>

        <button
            class="button"
            onclick="returnToHQ()">

            RETURN TO HQ

        </button>

    `;

}


/* ===================================================== */
/* CASE 001 — MEMORY CHECK                              */
/* ===================================================== */

function showCase001MemoryCheck() {

    getActiveContainer().innerHTML = `

        <div class="top-secret">
            CASE 001 — ACCESS RESTRICTED
        </div>

        <div class="case">
            MEMORY VERIFICATION REQUIRED
        </div>

        <h1>🩹</h1>

        <h2>
            PROVE YOU REMEMBER, FOX.
        </h2>

        <p>
            Before this classified file can be opened,
            you must identify the date connected to
            the incident.
        </p>

        <br>

        <p style="color:#ffcc66;">
            MEMORY VERIFICATION
        </p>

        <p>
            <strong>
                What was the date of our first date? ❤️
            </strong>
        </p>

        <p style="color:#777;">
            Enter the date in any reasonable format.
        </p>

        <input
            type="text"
            id="memoryAnswer"
            class="quiz-input"
            placeholder="Enter Date"
            autocomplete="off"
        >

        <br><br>

        <button
            class="button"
            onclick="verifyCase001Memory()">

            VERIFY MEMORY

        </button>

        <p id="memoryMessage"></p>

        <br>

        <button
            class="button"
            onclick="returnToHQ()">

            RETURN TO HQ

        </button>

    `;

}


/* ===================================================== */
/* CASE 001 — MEMORY VERIFY                             */
/* ===================================================== */

function verifyCase001Memory() {

    const answer =
        document
            .getElementById("memoryAnswer")
            .value
            .trim()
            .toLowerCase();


    const message =
        document.getElementById("memoryMessage");


    const correctAnswers = [

        "3rd august 2025",
        "3 august 2025",
        "3rd august, 2025",
        "3 august, 2025",
        "03 august 2025",
        "03/08/2025",
        "3/8/2025",
        "03-08-2025",
        "3-8-2025"

    ];


    if (correctAnswers.includes(answer)) {

        message.innerHTML = `

            <span style="color:#b7ff5a;">
                ✓ MEMORY VERIFIED.
            </span>

            <br><br>

            03 AUGUST 2025

            <br><br>

            Date confirmed.

            <br><br>

            And yes, Fox...

            <br>

            that was the day of the
            Bandage Incident. 🩹

            <br><br>

            <span style="color:#ff9ecb;">
                The Bunny is impressed. 😌
            </span>

        `;


        const enterButton =
            document.createElement("button");


        enterButton.className =
            "button";

        enterButton.textContent =
            "ENTER CASE 001";


        enterButton.onclick =
            openCaseFile;


        message.insertAdjacentElement(
            "afterend",
            enterButton
        );


        document
            .getElementById("memoryAnswer")
            .disabled = true;


    } else {

        message.innerHTML = `

            <span style="color:#ff3b30;">
                ✗ MEMORY VERIFICATION FAILED. 🚨
            </span>

            <br><br>

            Seriously, Fox? 😭

            <br>

            The Bunny remembers this date.

            <br><br>

            You have one job.
            Try again. 😋

        `;

    }

}


/* ===================================================== */
/* CASE 001 — FILE                                      */
/* ===================================================== */

function openCaseFile() {

    getActiveContainer().innerHTML = `

        <div class="top-secret">
            CLASSIFIED FILE 001
        </div>

        <div class="case">
            THE BANDAGE INCIDENT
        </div>

        <h1>🩹</h1>

        <p style="color:#ffcc66;">
            CASE STATUS: ACTIVE
        </p>

        <p>
            The memory verification has been passed.
        </p>

        <p>
            The Bunny has authorized you to examine
            the final piece of evidence.
        </p>

        <br>

        <p style="color:#b7ff5a;">
            EVIDENCE #004
        </p>

        <h2>
            WITNESS OBSERVATION
        </h2>

        <p>
            The Bunny was injured.
        </p>

        <p>
            The Fox noticed the injury
            and helped her.
        </p>

        <p>
            But investigators noticed something unusual.
        </p>

        <p style="color:#ff9ecb;">
            The Bunny wasn't paying much attention
            to her injured foot.
        </p>

        <p>
            She was watching the Fox instead. 😋
        </p>

        <br>

        <button
            class="button"
            onclick="startCase001Reconstruction()">

            EXAMINE EVIDENCE

        </button>

    `;

}


/* ===================================================== */
/* CASE 001 — TIMELINE                                  */
/* ===================================================== */

function startCase001Reconstruction() {

    case001Sequence = [];
    case001NextStep = 1;


    getActiveContainer().innerHTML = `

        <div class="top-secret">
            CASE 001 — ACTIVE INVESTIGATION
        </div>

        <div class="case">
            INCIDENT RECONSTRUCTION
        </div>

        <h1>🧩</h1>

        <h2>
            RECONSTRUCT THE INCIDENT
        </h2>

        <p>
            Agent Fox, the evidence has been reviewed.
        </p>

        <p>
            Now determine the correct sequence
            of events.
        </p>

        <p style="color:#ffcc66;">
            Select the events in the correct order.
        </p>

        <div class="quiz-options">

            <button
                class="quiz-option"
                data-event="1"
                onclick="selectTimelineEvent(1)">

                THE FOX HELPED THE BUNNY

            </button>

            <button
                class="quiz-option"
                data-event="2"
                onclick="selectTimelineEvent(2)">

                THE BUNNY WAS INJURED

            </button>

            <button
                class="quiz-option"
                data-event="3"
                onclick="selectTimelineEvent(3)">

                THE FOX NOTICED THE INJURY

            </button>

            <button
                class="quiz-option"
                data-event="4"
                onclick="selectTimelineEvent(4)">

                THE BUNNY WATCHED THE FOX 😋

            </button>

        </div>

        <p id="timelineMessage"></p>

        <div id="timelineProgress"></div>

        <br>

        <button
            class="button"
            onclick="returnToHQ()">

            RETURN TO HQ

        </button>

    `;

}


/* ===================================================== */
/* TIMELINE SELECTION                                   */
/* ===================================================== */

function selectTimelineEvent(eventNumber) {

    const message =
        document.getElementById("timelineMessage");


    const progress =
        document.getElementById("timelineProgress");


    const correctSequence =

function case003Stage4() {

    getActiveContainer().innerHTML = `

        <div class="top-secret">
            CASE 003 — FINAL QUESTION
        </div>

        <div class="case">
            AGENT FOX — FINAL STATEMENT
        </div>

        <h1>📝</h1>

        <p style="color:#ffcc66;">
            You have heard Bunny's side.
        </p>

        <br>

        <h2>
            What would you do differently?
        </h2>

        <p>
            You get one answer.
        </p>

        <p style="color:#999;">
            Think before submitting it.
        </p>

        <textarea
            id="case003Stage4Answer"
            class="assignment-textarea"
            placeholder="What would you do differently?"
        ></textarea>

        <br>

        <button
            class="button"
            onclick="submitCase003()">

            SUBMIT FINAL STATEMENT

        </button>

        <p id="case003SubmitMessage"></p>

    `;

}


/* ===================================================== */
/* CASE 003 — SUBMIT                                   */
/* ===================================================== */

async function submitCase003() {

    const answer =
        document
            .getElementById("case003Stage4Answer")
            .value
            .trim();


    const message =
        document.getElementById(
            "case003SubmitMessage"
        );


    if (!answer) {

        message.innerHTML = `

            <span style="color:#ff3b30;">
                FINAL STATEMENT REQUIRED, FOX. 🦊
            </span>

        `;

        return;

    }


    case003Answers.stage4 = answer;


    /*
        TRANSMITTING FIRST
    */

    message.innerHTML = `

        <span style="color:#b7ff5a;">
            TRANSMITTING TO BUNNY HQ...
        </span>

    `;


    try {

        const response =
            await fetch(
                FORMSPREE_ENDPOINT,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body: JSON.stringify({

                        case:
                            "CASE 003 — THE DECISION",

                        codename:
                            "SLY FOX",

                        stage1:
                            "At which point were Bunny's feelings reasonable?",

                        stage1Answer:
                            case003Answers.stage1,

                        stage2:
                            "Role reversal — how would you feel?",

                        stage2Answer:
                            case003Answers.stage2,

                        stage3:
                            "What did your decision communicate to Bunny?",

                        stage3Answer:
                            case003Answers.stage3,

                        stage4:
                            "What would you do differently?",

                        stage4Answer:
                            case003Answers.stage4,

                        status:
                            "CASE 003 — INVESTIGATION COMPLETED"

                    })

                }
            );


        if (response.ok) {

            /*
                SUCCESS MESSAGE
            */

            message.innerHTML = `

                <span style="color:#b7ff5a;">

                    ✓ THEORY RECEIVED BY BUNNY HQ.

                </span>

            `;


            caseProgress.case003 = true;


            localStorage.setItem(
                "case003Complete",
                "true"
            );


            setTimeout(() => {

                showCase003Completed();

            }, 1500);


        } else {

            message.innerHTML = `

                <span style="color:#ff3b30;">
                    TRANSMISSION FAILED.
                </span>

                <br><br>

                Please try again, Fox.

            `;

        }

    } catch (error) {

        message.innerHTML = `

            <span style="color:#ff3b30;">
                CONNECTION TO BUNNY HQ FAILED.
            </span>

            <br><br>

            Please try again.

        `;

    }

}


/* ===================================================== */

        </h2>

        <p>

        </p>

        </p>

        <br>

/* ===================================================== */
/* CASE 003 — REINVESTIGATE                            */
/* ===================================================== */

function replayCase003() {

    /*
        IMPORTANT:
        We DO NOT reset caseProgress.case003.

        The case remains completed even though
        the agent is allowed to investigate it again.
    */

    case003Answers = {

        stage1: "",
        stage2: "",
        stage3: "",
        stage4: ""

    };


    startCase003();

}


/* ===================================================== */
/* RETURN TO HQ                                         */
/* ===================================================== */

function returnToHQ() {

    showScreen("hqScreen");

    showHQ();

}


/* ===================================================== */
/* OPTIONAL DEVELOPER MODE                              */
/* ===================================================== */

function developerMode() {

    showScreen("hqScreen");

    showHQ();

}
