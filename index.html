<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Operation Sly Fox</title>

<style>

/* ================================= */
/* GLOBAL                            */
/* ================================= */

html,
body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

body {

    margin: 0;

    min-height: 100vh;
    min-height: 100dvh;

    background: #080a09;
    color: #b7ff5a;

    font-family: monospace;

    text-align: center;
}

* {
    box-sizing: border-box;
}

button,
input,
textarea {
    max-width: 100%;
}


/* ================================= */
/* SCREEN                            */
/* ================================= */

.screen {

    width: 100%;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;
}

.screen .container {

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    text-align: center;
}

.hidden {
    display: none !important;
}


/* ================================= */
/* CONTAINER                         */
/* ================================= */

.container {

    width: 90%;

    max-width: 500px;
}


/* ================================= */
/* TOP SECRET                        */
/* ================================= */

.top-secret {

    color: #ff3b30;

    font-size: 14px;

    letter-spacing: 4px;

    margin-bottom: 30px;
}


/* ================================= */
/* HEADINGS                          */
/* ================================= */

h1 {

    font-size: 32px;

    letter-spacing: 5px;

    margin-bottom: 10px;
}

h2 {

    line-height: 1.6;

    color: #b7ff5a;
}


/* ================================= */
/* CASE LABEL                        */
/* ================================= */

.case {

    color: #777;

    margin-bottom: 30px;
}


/* ================================= */
/* BUTTON                            */
/* ================================= */

.button {

    background: transparent;

    color: #b7ff5a;

    border: 1px solid #b7ff5a;

    padding: 15px 30px;

    font-family: monospace;

    font-size: 16px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
}

.button:hover {

    background: #b7ff5a;

    color: #080a09;
}

.button:active {

    transform: scale(0.97);
}


/* ================================= */
/* ACCESS FORM                       */
/* ================================= */

.access-box {

    margin-top: 30px;
}

.access-box label {

    display: block;

    width: 100%;

    margin-bottom: 12px;

    font-size: 17px;

    line-height: 1.4;

    letter-spacing: 1.5px;
}

.access-box input {

    display: block;

    width: 100%;

    min-height: 54px;

    margin: 0 auto;

    padding: 14px 16px;

    font-size: 18px;

    text-align: center;

    border-radius: 10px;

    background: transparent;

    color: #b7ff5a;

    border: 1px solid #555;

    outline: none;

    font-family: monospace;
}

.access-box input:focus {

    border-color: #b7ff5a;
}

.access-box input::placeholder {

    color: #666;
}

.access-box .button {

    display: block;

    width: 100%;

    margin-top: 28px;

    margin-bottom: 35px;

    min-height: 56px;

    font-size: 17px;

    font-weight: bold;
}

#accessMessage,
#codenameMessage {

    margin-top: 18px;

    font-size: 16px;

    line-height: 1.5;
}


/* ================================= */
/* HQ STATUS                         */
/* ================================= */

.mission-status {

    width: 100%;

    margin: 25px auto;

    padding: 14px 18px;

    border: 1px solid rgba(183,255,90,0.35);

    border-radius: 12px;

    background: rgba(183,255,90,0.04);
}

.status-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 9px 0;

    font-size: 14px;

    letter-spacing: 1px;
}

.status-row + .status-row {

    border-top:
        1px solid rgba(255,255,255,0.08);
}

.status-row span {

    color: #999;
}

.status-row strong {

    color: #b7ff5a;
}

.hq-welcome {

    font-size: 20px;

    font-weight: bold;

    margin-top: 25px;
}

.hq-message {

    color: #ccc;
}

.tease {

    margin-top: 20px;

    color: #b7ff5a;

    font-style: italic;

    line-height: 1.6;
}


/* ================================= */
/* CASE GRID                         */
/* ================================= */

.case-grid {

    display: grid;

    grid-template-columns: 1fr;

    gap: 16px;

    margin-top: 25px;

    width: 100%;
}


/* ================================= */
/* CASE CARD                         */
/* ================================= */

.case-card {

    width: 100%;

    min-height: 125px;

    padding: 20px;

    background:
        rgba(10,10,10,0.85);

    border: 1px solid #b7ff5a;

    border-radius: 14px;

    color: white;

    text-align: left;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 7px;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    font-family: monospace;
}

.case-card:hover {

    background:
        rgba(183,255,90,0.08);

    box-shadow:
        0 0 18px
        rgba(183,255,90,0.15);
}

.case-card:active {

    transform: scale(0.97);
}

.case-number {

    font-size: 12px;

    color: #b7ff5a;

    letter-spacing: 2px;
}

.case-title {

    font-size: 20px;

    font-weight: bold;

    line-height: 1.3;
}

.case-status {

    font-size: 11px;

    color: #999;

    letter-spacing: 1px;
}

/* QUIZ                              */
/* ================================= */
